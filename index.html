<!DOCTYPE html>
<html>
<!-- comment -->

    <head>
        <title>
            Test title
        </title>
        
        <!-- 
        put . before element to make it a class ".name{}", then put it in body tag as "class = name" 
        -->
        <style>
            /*comment*/
            body { 
                margin: 0; 
                padding: 0; 
                height: 100%; 
                overflow: hidden; 
                background-color: rgb(217, 219, 219); 
            }
            #home-content {
                padding: 0;
            }
        /*
                iframe { 
                width: 100%; 
                height: 100%; 
                border: none; 
            }
        */
            #game-frame { 
                display: none;
                width: 100%; 
                height: 100%; 
                border: none; 
                position: absolute;
                top: 0;
                left: 0;
                z-index: 10;
            }
        </style>
        <script>
            //comment
            // Runs when someone clicks the link
            function launchGame(event, gameUrl) {
                event.preventDefault(); // Stop the browser from changing URLs
                
                const frame = document.getElementById('game-frame');
                const content = document.getElementById('home-content');
                
                content.style.display = 'none'; // Hide your original text and links
                frame.style.display = 'block';  // Reveal the Pygame canvas frame
                frame.src = gameUrl //"web/index.html";   // Start loading the game
            }

            // This is the magic function your Python code will call when you press 'X'
            function closeGame() {
                const frame = document.getElementById('game-frame');
                const content = document.getElementById('home-content');
                
                frame.style.display = 'none';   // Hide the game frame completely
                content.style.display = 'block'; // Bring back your original text and links
                frame.src = "about:blank";       // Unload the game completely to free memory and prevent double music
            }
        </script>

    </head>



    <body>
        <audio id="global-player" controls autoplay loop style="position:fixed; bottom:10px; left:10px;">
            <source src="credits.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <!--
        <p> test para </p>
        <h> test head </h>
        <a href="web/index.html">
            Pac-man
        </a>
        -->
        <div id="home-content">
            <p>test para</p>
            <h1>test head</h1>
            <p>
                <a href="web/snakeindex.html" onclick="launchGame(event, 'web/snakeindex.html')">
                    Pac-man
                </a>
            </p>

        </div>
        <!--<iframe src="web/index.html"></iframe>-->
        <iframe id="game-frame" src="about:blank"></iframe>
    </body>
    
</html>
