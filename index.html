<!DOCTYPE html>

<!-- comment -->

    <head>
        <title>
            Pygame hub
        </title>
        
        <!-- 
        put . before element to make it a class ".name{}", then put it in body tag as "class = name" 
        -->
        <style>
            /*comment*/
            body { 
                margin: 0px; 
                padding: 0px; 
                height: 100%; 
                color:rgb(0, 0, 0);
                background-color: rgb(217, 219, 219); 
            }
            
            #home-content {
                padding: 0px;
                display: flex;
                flex-direction: column;
                min-height: 70vh; 
                justify-content: space-between;
                padding: 20px;
                box-sizing: border-box;
                
            }
            h1 {
                text-align:center;
            }
            .links p {
                background-color: transparent;
                margin: 10px;
                font-size: 24px;
            }
            
            .links a {
                color: rgb(148, 59, 160);
                text-decoration: none;
                font-weight: bold;
                padding: 10px;
                border: 2px solid rgb(148, 59, 160);
                border-radius: 10px;
                background-color: transparent;
                transition: 0.2s;
            }
            .center-container {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 20px;
                flex-wrap: wrap; 
                margin-top: 20px;
            }
            p {
                color:rgb(148, 59, 160);
                background-color: transparent;
            }
            /*CSS Flexbox (for rows/columns) and CSS Grid (for 2x2 layouts or corner placements)*/
            .leaderboard-container {
                display: flex;
                gap: 30px;
                margin-top: 30px;
                margin-left: 50px;
                font-family: Arial, sans-serif;
            }
            #leaderboard {
                background-color:rgb(0, 0, 0);
                color:white;
                width: 300px;
                height: 300px;
                border-radius: 2%;
                padding: 15px;
            }
        /*
                iframe { 
                width: 100%; 
                height: 100%; 
            }
        */
            #game-frame { 
                display: none;
                width: 100%; 
                height: 100%; 
                border: none; 
                position: absolute;
            }
        </style>
        <script>
            //comment

            function launchGame(event, gameUrl) {
                event.preventDefault(); // Stop the browser from changing URLs
                
                const frame = document.getElementById('game-frame');
                const content = document.getElementById('home-content');
                
                content.style.display = 'none'; //hide home text and links
                frame.style.display = 'block';  //reveal frame block is to display for size of container
                frame.src = gameUrl //"web/index.html";   //src is destination of the frame
            }

            
            function closeGame() {
                const frame = document.getElementById('game-frame');
                const content = document.getElementById('home-content');
                if (frame.contentWindow) {
                    frame.contentWindow.onbeforeunload = null;
                }
                frame.style.display = 'none';  
                content.style.display = 'block'; 
                
                // Refresh FIRST while the frame is still technically alive
                fetchLeaderboard('pacman', 'leaderboard-list');
                fetchLeaderboard('snake', 'snake-list');
                fetchLeaderboard('vibe-snake', 'vibe-snake-list');
                
                // Unload the game AFTER a tiny delay so the fetch requests aren't killed
                setTimeout(() => {
                    frame.src = "about:blank";       
                }, 100); 
            }
    
            async function fetchLeaderboard(gameId, listElementId) {
                const listElement = document.getElementById(listElementId);
                try {
                    const response = await fetch(`https://my-leaderboard-worker.my-leaderboard-worker.workers.dev/scores?game=${gameId}`);
                    let scores = await response.json();
                    
                    listElement.innerHTML = '';
                    
                    if (scores.length === 0) {
                        listElement.innerHTML = '<li>No scores yet. Be the first!</li>';
                        return;
                    }

                    const highestScores = {};
                    scores.forEach(entry => {
                        const name = entry.player_name;
                        if (!highestScores[name] || entry.score > highestScores[name].score) {
                            highestScores[name] = entry;
                        }
                    });
                    const uniqueScores = Object.values(highestScores).sort((a, b) => b.score - a.score);

                    uniqueScores.slice(0, 10).forEach((entry) => {
                        const li = document.createElement('li');
                        const safeName = entry.player_name.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        li.innerHTML = `<strong>${safeName}</strong> — ${entry.score} pts`;
                        li.style.marginBottom = '5px';
                        listElement.appendChild(li);
                    });
                } catch (error) {
                    console.error(`Error fetching ${gameId} leaderboard:`, error);
                    listElement.innerHTML = '<li>Error loading scores.</li>';
                }
            }

            //when page loads fetch leaderboards
            window.onload = () => {
                fetchLeaderboard('pacman', 'leaderboard-list'); // CHANGED to match ID
                fetchLeaderboard('snake', 'snake-list');
                fetchLeaderboard('vibe-snake', 'vibe-snake-list');
            };
        </script>

    </head>
